# One-shot Job that applies the SQL migrations before the backend serves traffic.
# Runs in the backend image (has node + pg + the migration files). The runner
# retries the DB connection (MIGRATE_MAX_WAIT_MS) so it can start before
# Postgres is ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/part-of: ai-platform
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/part-of: ai-platform
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ai-platform/backend:latest
          command: ["node", "packages/db/dist/migrate.js"]
          envFrom:
            - configMapRef:
                name: ai-platform-config
            - secretRef:
                name: ai-platform-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
