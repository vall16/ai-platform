# SaaS backend (Fastify). The initContainer blocks until every migration is
# applied (rows in schema_migrations == .sql files in the image), so the pod
# never serves traffic before the schema is ready.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: ai-platform
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: ai-platform
    spec:
      initContainers:
        - name: wait-for-migrations
          image: ai-platform/backend:latest
          command:
            - node
            - -e
            - |
              const {Pool}=require('pg');
              const fs=require('fs');
              const dir=process.env.MIGRATIONS_DIR||'/app/packages/db/src/migrations';
              const expected=fs.readdirSync(dir).filter(f=>f.endsWith('.sql')).length;
              const p=new Pool({connectionString:process.env.DATABASE_URL});
              (async()=>{
                const deadline=Date.now()+(parseInt(process.env.MIGRATE_MAX_WAIT_MS||'120000',10));
                for(;;){
                  try{
                    const r=await p.query('SELECT COUNT(*)::int AS n FROM schema_migrations');
                    const n=r.rows[0].n;
                    if(n>=expected){await p.end();console.log('migrations complete ('+n+'/'+expected+')');process.exit(0);}
                    console.log('waiting for migrations ('+n+'/'+expected+')');
                  }catch(e){console.log('db not ready: '+(e.message||e));}
                  if(Date.now()>=deadline){console.error('timed out waiting for migrations');process.exit(1);}
                  await new Promise(r=>setTimeout(r,2000));
                }
              })();
          envFrom:
            - configMapRef:
                name: ai-platform-config
            - secretRef:
                name: ai-platform-secrets
      containers:
        - name: backend
          image: ai-platform/backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ai-platform-config
            - secretRef:
                name: ai-platform-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
